format = "${custom.directory}$git_branch$git_status$c$nodejs$character"
add_newline = true
command_timeout = 700

# パスを最大4階層に省略し、各ディレクトリを右向きの色付きセグメントで描画する。
[custom.directory]
command = '''
display_path="$PWD"
case "$display_path" in
  "$HOME") display_path="~" ;;
  "$HOME"/*) display_path="~/${display_path#"$HOME"/}" ;;
esac

printf '%s\n' "$display_path" | awk -F/ '
  {
    colors[0] = "125;211;252"
    colors[1] = "196;181;253"
    colors[2] = "94;234;212"
    colors[3] = "253;186;116"
    start = NF > 4 ? NF - 3 : 1

    if (start > 1) {
      printf "\033[1;38;2;11;18;32;48;2;148;163;184m … \033[0m"
      printf "\033[38;2;148;163;184;48;2;%sm\033[0m", colors[0]
    }

    for (i = start; i <= NF; i++) {
      color_index = (i - start) % 4
      code = colors[color_index]
      label = $i
      if (i == start) label = "󰉋  " label

      printf "\033[1;38;2;11;18;32;48;2;%sm %s \033[0m", code, label
      if (i < NF) {
        next_code = colors[(color_index + 1) % 4]
        printf "\033[38;2;%s;48;2;%sm\033[0m", code, next_code
      } else {
        printf "\033[38;2;%sm\033[0m", code
      }
    }
  }
'

if [ ! -w "$PWD" ]; then
  printf ' \033[1;38;2;251;113;133m󰌾\033[0m'
fi
'''
when = true
format = "$output"
style = ""
unsafe_no_escape = true
shell = ["sh"]

[git_branch]
symbol = "git "
format = " [](#c4b5fd)[$symbol$branch](bold fg:#0b1220 bg:#c4b5fd)[](#c4b5fd)"

[git_status]
format = " [](#fbbf24)[$all_status](bold fg:#0b1220 bg:#fbbf24)[](#fbbf24)"
conflicted = ""
ahead = ""
behind = ""
diverged = ""
up_to_date = ""
untracked = " U$count"
stashed = ""
modified = " M$count"
staged = " A$count"
renamed = ""
deleted = " D$count"
typechanged = ""

[c]
symbol = " "
style = "bold #7dd3fc"
format = " [${symbol}${version}]($style)"

[nodejs]
symbol = " "
style = "bold #5eead4"
format = " [${symbol}${version}]($style)"

[character]
success_symbol = "[ ❯](bold #5eead4)"
error_symbol = "[ ❯](bold #fb7185)"
