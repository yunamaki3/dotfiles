format = """
[╭─](bold #475569)[ 󰉋 ](bold #fb7185)${custom.directory}$git_branch$git_status$git_metrics$c$nodejs
[╰─](bold #475569)$character"""
add_newline = true
command_timeout = 700

# パスを最大4階層に省略し、各ディレクトリと区切りを別の色で描画する。
[custom.directory]
command = '''
display_path="$PWD"
case "$display_path" in
  "$HOME") display_path="~" ;;
  "$HOME"/*) display_path="~/${display_path#"$HOME"/}" ;;
esac

printf '%s\n' "$display_path" | awk -F/ '
  {
    start = NF > 4 ? NF - 3 : 1
    if (start > 1) {
      printf "\033[38;2;148;163;184m…\033[0m"
      printf "\033[1;38;2;251;113;133m/\033[0m"
    }

    for (i = start; i <= NF; i++) {
      color = (i - start) % 4
      if (color == 0) code = "125;211;252"
      if (color == 1) code = "196;181;253"
      if (color == 2) code = "94;234;212"
      if (color == 3) code = "253;186;116"

      printf "\033[1;38;2;%sm%s\033[0m", code, $i
      if (i < NF) {
        printf "\033[1;38;2;251;113;133m/\033[0m"
      }
    }
  }
'

if [ ! -w "$PWD" ]; then
  printf ' \033[1;38;2;251;113;133m󰌾\033[0m'
fi
'''
when = true
format = "$output"
style = ""
unsafe_no_escape = true
shell = ["sh"]

[git_branch]
symbol = " "
format = " [](#c4b5fd)[$symbol$branch](bold fg:#0b1220 bg:#c4b5fd)[](#c4b5fd)"

[git_status]
format = " [](#fbbf24)[$all_status$ahead_behind](bold fg:#0b1220 bg:#fbbf24)[](#fbbf24)"
conflicted = " ="
ahead = " ⇡$count"
behind = " ⇣$count"
diverged = " ⇕⇡$ahead_count⇣$behind_count"
up_to_date = " ✓"
untracked = " ?$count"
stashed = " $"
modified = " !$count"
staged = " +$count"
renamed = " »$count"
deleted = " ✘$count"
typechanged = " ≋$count"

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = "bold #4ade80"
deleted_style = "bold #fb7185"
format = " ([+$added]($added_style))([-$deleted]($deleted_style))"

[c]
symbol = " "
style = "bold #7dd3fc"
format = " [${symbol}${version}]($style)"

[nodejs]
symbol = " "
style = "bold #5eead4"
format = " [${symbol}${version}]($style)"

[character]
success_symbol = "[ ❯](bold #5eead4)"
error_symbol = "[ ❯](bold #fb7185)"
